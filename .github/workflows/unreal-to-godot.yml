# Exports a level for Godot with vortechU/UnrealToGodot, headless (Tools/unreal_to_godot/export.py).
# The result is the "unreal-to-godot" artifact, which Shrek-World's tools/fetch.sh downloads.
name: unreal-to-godot
on:
  push:
    branches: [unreal-to-godot]
  workflow_dispatch:
    inputs:
      level:
        description: Level to export
        default: /Game/Levels/Swamp/L_Swamp_01

env:
  GODOT: 4.7.2-stable
  LEVEL: ${{ inputs.level || '/Game/Levels/Swamp/L_Swamp_01' }}
  IMAGE: ghcr.io/epicgames/unreal-engine:dev-slim-5.8.1

jobs:
  export:
    runs-on: ubuntu-latest   # public repo runner: 145 GB disk for the 56 GB engine image
    timeout-minutes: 350
    steps:
      - name: Reclaim disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with: { tool-cache: true, android: true, dotnet: true, haskell: true, large-packages: true, docker-images: true, swap-storage: true }

      - uses: actions/checkout@v4
        with: { submodules: false, fetch-depth: 1 }

      # As in build-linux.yml (ShrekLevels is gone upstream; two plugins need clang patches), plus UnrealToGodot.
      - name: Plugins
        run: |
          set -euo pipefail
          for m in ClimbingSystem CombatSystem GameInstanceServices InventorySystem UIGoodies UnrealToGodot; do
            git submodule update --init --force "Plugins/$m"
          done
          git -C Plugins/InventorySystem apply "$PWD/.github/patches/inventorysystem-reorder-ctor.patch"
          git -C Plugins/CombatSystem apply "$PWD/.github/patches/combatsystem-notify-5.8.patch"
          jq '.Plugins += [{"Name":"UnrealToGodot","Enabled":true}]' Shrek2Remake.uproject > p.tmp && mv p.tmp Shrek2Remake.uproject

      - name: Restore derived data cache
        uses: actions/cache@v4
        with:
          path: .ue-ddc
          key: unreal-to-godot-ddc-${{ hashFiles('Content/**', 'Config/**') }}
          restore-keys: |
            unreal-to-godot-ddc-
            ue-ddc-nobindless-${{ runner.os }}-

      - name: Pull engine image
        run: |
          echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull -q "$IMAGE"

      - name: Build editor
        timeout-minutes: 90
        run: |
          set -euo pipefail
          mkdir -p .ue-ddc out
          sudo chown -R 1000:1000 "$PWD"   # the editor refuses to run as root; the image user is ue4 (1000)
          # -NoUBA: Unreal Build Accelerator runs degraded when /dev/shm is below its 1 GB floor (Docker's default
          # is 64 MB) and then its compiler processes segfault in a loop, which hangs the build. This target is
          # ~18 actions, so the accelerator buys nothing; --shm-size keeps it above the floor if it is ever used.
          docker run --rm --user 1000:1000 --shm-size=2g -v "$PWD":/project -e HOME=/tmp/uehome "$IMAGE" bash -euo pipefail -c '
            mkdir -p "$HOME"
            /home/ue4/UnrealEngine/Engine/Build/BatchFiles/Linux/Build.sh Shrek2RemakeEditor Linux Development \
              -Project=/project/Shrek2Remake.uproject -WaitMutex -NoUBA'

      - name: Export
        timeout-minutes: 240
        run: |
          set -euo pipefail
          trap 'sudo chown -R "$(id -u):$(id -g)" "$PWD"' EXIT
          docker run --rm --user 1000:1000 -v "$PWD":/project -e HOME=/tmp/uehome \
            -e UE_LocalDerivedDataCache=/project/.ue-ddc -e LEVEL="$LEVEL" -e OUT=/project/out \
            "$IMAGE" bash -euo pipefail -c '
              mkdir -p "$HOME"
              # The editor exits non-zero whenever it logs errors, including for references to assets the project
              # lacks (uncommitted *_BuiltData, the private ShrekLevels plugin); summary.json decides success.
              /home/ue4/UnrealEngine/Engine/Binaries/Linux/UnrealEditor-Cmd /project/Shrek2Remake.uproject \
                -run=pythonscript -script=/project/Tools/unreal_to_godot/export.py \
                -nullrhi -unattended -nosplash -nopause -stdout \
                > /project/out/editor.log 2>&1 || true
              grep -E "unreal-to-godot:|Unreal to Godot|LogPython: Error" /project/out/editor.log | tail -40 || true'
          python3 -c 'import json,sys; s=json.load(open("out/summary.json")); print(s); sys.exit(0 if s["layout"] and not s["failed"] else 1)'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unreal-to-godot
          path: |
            out/
            !out/editor.log
          compression-level: 1

      - name: Upload the editor log
        if: always()
        run: gzip -9 out/editor.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: editor-log, path: out/editor.log.gz }

  # The level read straight off disk, and checked against what the engine exported.
  #
  # The engine cannot give us everything: actor GUIDs are a bare UPROPERTY() and so unreadable from Python,
  # the .t3d exporter unbinds dynamic delegates before writing, and it skips foliage. Tools/umap_reader
  # parses the .umap itself, which has none of those limits. The two are unrelated code reading unrelated
  # inputs, so they are compared: every value both carry must agree, or this job fails.
  raw:
    needs: export
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { submodules: false, fetch-depth: 1 }
      - name: The .umap reader's parser
        run: git submodule update --init --force --depth 1 Tools/umap_reader/CUE4Parse

      - uses: actions/download-artifact@v4
        with: { name: unreal-to-godot, path: export }

      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }

      - name: Read the level, then check it against the engine's export
        run: |
          set -euo pipefail
          level="$(basename "$LEVEL")"
          dotnet run --project Tools/umap_reader -c Release -- . "$level" out/level_raw.json
          python3 Tools/unreal_to_godot/compare_exports.py out/level_raw.json "export/$level.t3d"

      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: level-raw, path: out/level_raw.json }

  # The exported level, imported into a ready-to-open Godot project. Godot's own importer addon is an
  # EditorScript, which cannot be run from the command line, so the import runs from an editor plugin
  # (Tools/godot_project/addons/shrek_import) in a headless editor.
  godot-project:
    needs: export
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { submodules: false, fetch-depth: 1 }
      - name: The exporter (for its Godot importer addon)
        run: git submodule update --init --force --depth 1 Plugins/UnrealToGodot

      - uses: actions/download-artifact@v4
        with: { name: unreal-to-godot, path: export }

      - name: Assemble the project
        run: |
          set -euo pipefail
          cp -r Tools/godot_project project
          cp -r Plugins/UnrealToGodot/addons/unreal_importer project/addons/
          mv export project/unreal
          rm -f project/unreal/editor.log

      - name: Godot ${{ env.GODOT }}
        run: |
          set -euo pipefail
          curl -sSLo godot.zip "https://github.com/godotengine/godot/releases/download/$GODOT/Godot_v${GODOT}_linux.x86_64.zip"
          unzip -q godot.zip && mv Godot_v${GODOT}_linux.x86_64 /usr/local/bin/godot && chmod +x /usr/local/bin/godot
          godot --version

      - name: Import the assets
        # Twice: the second pass picks up what the first one's imports made available.
        run: |
          godot --headless --path project --import 2>&1 | grep -vE "^$" | tail -5
          godot --headless --path project --import 2>&1 | grep -vE "^$" | tail -5

      - name: Build the level
        env: { SHREK_IMPORT: "1" }
        run: |
          set -euo pipefail
          godot --headless --editor --path project 2>&1 | tee godot.log | grep -E "shrek_import:|SCRIPT ERROR|^ERROR" | head -40 || true
          grep -q "shrek_import: res://scenes/.*built" godot.log
          ls project/scenes

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: godot-project
          # .godot included: it is Godot's import cache (~130 MB), so the project opens without re-importing.
          # upload-artifact leaves hidden files out unless told otherwise, and .godot is one.
          include-hidden-files: true
          path: project/
          compression-level: 1
